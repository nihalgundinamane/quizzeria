services:
  # Backend — FastAPI
  - type: web
    name: quizzeria-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"

  # Frontend — Vite static site
  - type: web
    name: quizzeria-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://quizzeria-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
